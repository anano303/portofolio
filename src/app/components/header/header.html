<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" fragment="home" (click)="closeMenu()" [attr.aria-label]="'header.homeLabel' | translate">{{ 'header.logo' | translate }}</a>

    <button
      class="nav-toggle"
      type="button"
      [attr.aria-label]="(isMenuOpen ? 'header.closeMenu' : 'header.openMenu') | translate"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="main-navigation"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="main-navigation" class="site-nav" [class.is-open]="isMenuOpen" [attr.aria-label]="'nav.mainLabel' | translate">
      <div class="nav-links">
        <a
          *ngFor="let item of navigation"
          routerLink="/"
          [fragment]="item.href.slice(1)"
          (click)="closeMenu()"
        >
          {{ item.labelKey | translate }}
        </a>
      </div>

      <div class="nav-controls">
        <div class="language-switcher" role="group" [attr.aria-label]="'header.languageLabel' | translate">
          <button
            *ngFor="let option of languageOptions"
            type="button"
            [class.is-active]="languageService.currentLanguage === option.code"
            [attr.aria-pressed]="languageService.currentLanguage === option.code"
            [attr.lang]="option.code"
            (click)="changeLanguage(option.code)"
          >
            {{ option.label }}
          </button>
        </div>

        <button class="download-button" type="button" disabled [title]="'header.cvUnavailable' | translate">
          {{ 'header.cvUnavailable' | translate }}
        </button>
      </div>
    </nav>
  </div>
</header>
