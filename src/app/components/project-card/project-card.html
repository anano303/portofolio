<article class="project-card">
  <div class="project-preview project-preview--{{ project.previewClass }}" [class.has-image]="project.image">
    <img *ngIf="project.image" [src]="project.image" [alt]="project.titleKey | translate" width="1440" height="900" loading="lazy" decoding="async" />
    <span class="project-badge">{{ getCategoryLabel() }}</span>
    <div *ngIf="!project.image" class="preview-label">
      <span>{{ project.titleKey | translate }}</span>
    </div>
  </div>

  <div class="project-body">
    <h3>{{ project.titleKey | translate }}</h3>
    <p>{{ project.descriptionKey | translate }}</p>

    <ul class="tech-tags" [attr.aria-label]="'projects.techLabel' | translate">
      <li *ngFor="let item of project.tech">{{ item | translate }}</li>
    </ul>

    <a *ngIf="project.href; else unavailable" class="project-link" [href]="project.href" target="_blank" rel="noreferrer noopener">
      {{ 'projects.viewLive' | translate }}
    </a>
    <ng-template #unavailable>
      <span class="project-unavailable">{{ 'projects.placeholder' | translate }}</span>
    </ng-template>
  </div>
</article>
