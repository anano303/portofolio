<article class="project-card">
  <div class="project-preview project-preview--{{ project.previewClass }}">
    <span class="project-badge">{{ getCategoryLabel() }}</span>
    <div class="preview-label">
      <span>{{ project.titleKey | translate }}</span>
    </div>
  </div>

  <div class="project-body">
    <h3>{{ project.titleKey | translate }}</h3>
    <p>{{ project.descriptionKey | translate }}</p>

    <ul class="tech-tags" aria-label="Technology stack">
      <li *ngFor="let item of project.tech">{{ item }}</li>
    </ul>

    <a class="project-link" [href]="project.href" target="_blank" rel="noreferrer noopener">
      {{ 'projects.viewLive' | translate }}
    </a>
  </div>
</article>
