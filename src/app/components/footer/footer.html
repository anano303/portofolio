<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <p class="footer-name">{{ 'footer.title' | translate }}</p>
      <p class="footer-role">{{ 'footer.role' | translate }}</p>
    </div>

    <nav class="footer-nav" aria-label="Footer navigation">
      <a *ngFor="let item of navItems" [href]="item.href">{{ item.labelKey | translate }}</a>
    </nav>

    <div class="footer-socials" aria-label="Social links">
      <a *ngFor="let link of socialLinks" [href]="link.href" target="_blank" rel="noreferrer noopener">
        {{ link.label }}
      </a>
    </div>
  </div>

  <div class="footer-bottom">
    <div class="container">
      <p>{{ getCopyrightText() }}</p>
    </div>
  </div>
</footer>
