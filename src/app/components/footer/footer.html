<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <p class="footer-name">{{ 'footer.title' | translate }}</p>
      <p class="footer-role">{{ 'footer.role' | translate }}</p>
    </div>

    <nav class="footer-nav" [attr.aria-label]="'footer.navigationLabel' | translate">
      <a *ngFor="let item of navItems" routerLink="/" [fragment]="item.href.slice(1)">{{ item.labelKey | translate }}</a>
    </nav>

    <div class="footer-socials" [attr.aria-label]="'footer.socialLabel' | translate">
      <a *ngFor="let link of socialLinks" [href]="link.href" target="_blank" rel="noreferrer noopener">
        {{ link.labelKey | translate }}
      </a>
    </div>
  </div>

  <div class="footer-bottom">
    <div class="container">
      <p>{{ getCopyrightText() }}</p>
    </div>
  </div>
</footer>
